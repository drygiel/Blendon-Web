name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm vite build
      - run: pnpm prerender
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # End-to-end checks in Chromium, Firefox and WebKit. Reported, but they don't hold back a deploy.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e tests/e2e/webkit-probe.spec.ts --project=webkit
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
      # Temporary: the failure context in the log, for debugging the WebKit hangs.
      - if: failure()
        run: |
          for d in test-results/*webkit*/; do
            echo "::group::$d"
            cat "$d/error-context.md" 2>/dev/null | head -n 150
            unzip -p "$d/trace.zip" '*.trace' 2>/dev/null | grep -E '"type":"(console|event|log|error)"' | cut -c1-300 | tail -n 150
            echo "::endgroup::"
          done

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
